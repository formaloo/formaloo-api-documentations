<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formaloo API Documentation</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <style>
      html, body, #app { margin: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- @scalar/api-reference standalone bundle. Version is pinned in package.json. -->
    <script src="assets/scalar-api-reference.js"></script>
    <script>
      Scalar.createApiReference("#app", {
        url: "openapi-v3.0.yaml",
        agent: { disabled: true },
        hideClientButton: true,
        hideTestRequestButton: true,
        hideModels: true,
        customCss: [
          ".scalar-reference-intro-clients{display:none !important}",
          ".introduction-description .scalar-code-block,",
          ".introduction-description pre,",
          ".tag-section-container .section-columns > .section-column:first-child .scalar-code-block,",
          ".tag-section-container .section-columns > .section-column:first-child pre{display:none !important}"
        ].join("\n")
      })
    </script>
  </body>
</html>
