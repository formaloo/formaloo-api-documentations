<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formaloo API Documentation</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <style>
      html, body, #app { margin: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- @scalar/api-reference standalone bundle. Version is pinned in package.json. -->
    <script src="assets/scalar-api-reference.js"></script>
    <script>
      // Scalar keeps the next operation's sticky request card on screen while the
      // hash is still the introduction or a tag. Hide that panel until the hash
      // is an operation. replaceState does not fire hashchange.
      ;(function () {
        var method = /\/(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|TRACE|QUERY)\//i
        function isOperation() {
          var id = ""
          try { id = decodeURIComponent(location.hash.replace(/^#/, "")) } catch (e) { id = location.hash.replace(/^#/, "") }
          return method.test("/" + id + "/")
        }
        function sync() {
          document.documentElement.classList.toggle("scalar-non-operation", !isOperation())
        }
        var push = history.pushState
        var replace = history.replaceState
        history.pushState = function () { var result = push.apply(this, arguments); sync(); return result }
        history.replaceState = function () { var result = replace.apply(this, arguments); sync(); return result }
        window.addEventListener("hashchange", sync)
        window.addEventListener("popstate", sync)
        sync()
      })()
      Scalar.createApiReference("#app", {
        url: "openapi-v3.0.yaml",
        agent: { disabled: true },
        hideClientButton: true,
        hideTestRequestButton: true,
        hideModels: true,
        customCss: [
          ".scalar-reference-intro-clients{display:none !important}",
          ".introduction-description .scalar-code-block,",
          ".introduction-description pre,",
          ".tag-section-container .section-columns > .section-column:first-child .scalar-code-block,",
          ".tag-section-container .section-columns > .section-column:first-child pre{display:none !important}",
          "html.scalar-non-operation .examples{display:none !important}"
        ].join("\n")
      })
    </script>
  </body>
</html>
